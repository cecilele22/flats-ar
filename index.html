<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flats</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Model Viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

</head>


<body>


<!-- =========================
     LANDING PAGE
========================= -->

<section id="landing">

    <img
        src="container.png"
        alt=""
        class="landing-top-image">

    <img
        src="FLATS - Olive Green (PNG).png"
        alt="FLATS"
        class="logo-image">

    <div class="landing-overlay"></div>

    <div class="landing-content">

        <!-- CAMPAIGN MESSAGE -->

        <img
            src="FORWARD.png"
            alt="Campaign Message"
            class="campaign-message">


        <!-- SUPPORTING TEXT -->

        <p class="landing-text">
            Experience FLATS from a whole new perspective.
            Explore the development in 3D and discover it in AR.
        </p>


        <!-- CTA -->

        <button
            id="enterExperience"
            class="landing-button"
            onclick="location.href='#site'">

            Explore More

            <span>↗</span>

        </button>

    </div>

</section>



<!-- =========================
     INTRO
========================= -->

<section id="intro">

    <div class="logo">

        <img
            src="logo.png"
            alt="FLATS">

    </div>

</section>



<!-- =========================
     MAIN SITE
========================= -->

<main id="site">


    <!-- =========================
         HEADER
    ========================= -->

    <section class="top" id="top">

        <small>
            Discover the development
        </small>


        <h2>
            Lorem Ipsum
        </h2>


        <p>
            Explore the property in three dimensions.
            Rotate, zoom and view the development from every angle.
        </p>

    </section>



    <!-- =========================
         3D VIEWER
    ========================= -->

    <section class="viewer-wrapper">


        <!-- LOADING -->

        <div
            class="loading"
            id="loading">

            <div class="loading-inner">

                <span>
                    Loading experience
                </span>

                <div class="loader">

                    <div class="loader-line"></div>

                </div>

            </div>

        </div>



        <!-- MODEL VIEWER -->

        <model-viewer

            id="modelViewer"

            src="models/bldg3.glb"

            camera-controls

            auto-rotate
            auto-rotate-delay="1000"
            rotation-per-second="20deg"

            shadow-intensity="1"

            exposure="1"

            environment-image="neutral"

            ar

            ar-modes="webxr scene-viewer quick-look"

            alt="FLATS condominium building">

        </model-viewer>



        <!-- FULLSCREEN -->

        <button
            id="fullscreen"
            aria-label="Enter fullscreen"
            title="Fullscreen">

            ⛶

        </button>


    </section>



    <!-- =========================
         AR
    ========================= -->

    <section class="ar-section">


        <button
            id="arButton"
            type="button">

            View in AR

        </button>


        <div class="ar-note">

            Best experienced on a mobile device

        </div>


    </section>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer
        class="footer"
        id="footer">


        <img
            src="logo.png"
            alt="FLATS"
            class="footer-logo">


        <!-- SOCIAL MEDIA -->

        <div class="socials">


            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener"
                aria-label="Instagram">

                <i
                    class="fa-brands fa-instagram"
                    style="color: rgb(255, 255, 255);">
                </i>

            </a>



            <!-- FACEBOOK -->

            <a
                href="https://www.facebook.com/"
                target="_blank"
                rel="noopener"
                aria-label="Facebook">

                <i
                    class="fa-brands fa-facebook-f"
                    style="color: rgb(255, 255, 255);">
                </i>

            </a>


        </div>


    </footer>


</main>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   ELEMENTS
========================= */

const intro =
    document.getElementById("intro");

const site =
    document.getElementById("site");

const viewer =
    document.getElementById("modelViewer");

const loading =
    document.getElementById("loading");

const fullscreen =
    document.getElementById("fullscreen");

const arButton =
    document.getElementById("arButton");



/* =========================
   INTRO
========================= */

window.addEventListener(
    "load",
    () => {

        setTimeout(() => {

            if (intro) {
                intro.classList.add("hide");
            }

            if (site) {
                site.classList.add("show");
            }

        }, 2500);

    }
);



/* =========================
   MODEL LOADING
========================= */

viewer.addEventListener(
    "load",
    () => {

        console.log(
            "3D model loaded successfully."
        );


        loading.classList.add(
            "hidden"
        );

    }
);



/* =========================
   MODEL ERROR
========================= */

viewer.addEventListener(
    "error",
    (event) => {

        console.error(
            "3D MODEL ERROR:",
            event
        );


        loading.innerHTML = `

            <div class="loading-inner">

                <span>
                    Unable to load 3D model
                </span>

            </div>

        `;

    }
);



/* =========================
   FULLSCREEN
========================= */

fullscreen.addEventListener(
    "click",
    async () => {

        const wrapper =
            document.querySelector(
                ".viewer-wrapper"
            );


        try {

            if (
                !document.fullscreenElement
            ) {

                await wrapper.requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);



/* =========================
   AR BUTTON
========================= */

arButton.addEventListener(
    "click",
    async () => {

        console.log(
            "AR button clicked."
        );


        try {

            /*
             * Make sure the model has loaded
             * before trying to launch AR.
             */

            if (!viewer.loaded) {

                console.log(
                    "Waiting for model to load..."
                );

                await viewer.updateComplete;

            }


            /*
             * Launch AR
             */

            await viewer.activateAR();


        }

        catch (error) {

            console.error(
                "AR ERROR:",
                error
            );


            alert(
                "AR could not be launched. " +
                "Please open this website on a compatible " +
                "Android or iPhone device."
            );

        }

    }
);


</script>


</body>
</html>
