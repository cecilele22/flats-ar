<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline Residences | 3D & AR</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #111;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    height: 72px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: relative;
    z-index: 20;
    border-bottom: 1px solid #ddd;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
}

.logo span {
    display: block;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    color: #777;
    margin-top: 3px;
}

.ar-button {
    border: none;
    background: #111;
    color: white;
    padding: 13px 22px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .5px;
    transition: .2s;
}

.ar-button:hover {
    background: #333;
    transform: translateY(-1px);
}

/* =========================
   3D VIEWER
========================= */

.viewer-wrapper {
    position: relative;
    height: calc(100vh - 72px);
    width: 100%;
    background: #dfe5e8;
}

#viewer {
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   VIEWER CONTROLS
========================= */

.viewer-top {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
}

.viewer-title {
    background: rgba(255,255,255,.92);
    padding: 14px 18px;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.viewer-title strong {
    font-size: 14px;
}

.viewer-title small {
    display: block;
    color: #777;
    margin-top: 4px;
}

/* Bottom controls */

.controls {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
    background: rgba(255,255,255,.94);
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 6px 25px rgba(0,0,0,.15);
}

.control-button {
    border: none;
    background: #eee;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.control-button:hover {
    background: #ddd;
}

/* Fullscreen */

.fullscreen-button {
    position: absolute;
    right: 25px;
    bottom: 25px;
    z-index: 10;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 8px;

    background: rgba(255,255,255,.95);
    cursor: pointer;

    font-size: 22px;

    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.fullscreen-button:hover {
    background: white;
}

/* =========================
   AR PANEL
========================= */

#arPanel {
    display: none;
    position: fixed;
    inset: 0;
    background: white;
    z-index: 100;
}

.ar-header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid #ddd;
}

.close-ar {
    border: none;
    background: #eee;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
}

#arViewer {
    width: 100%;
    height: calc(100vh - 70px);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    .header {
        padding: 0 15px;
        height: 62px;
    }

    .logo {
        font-size: 16px;
    }

    .viewer-wrapper {
        height: calc(100vh - 62px);
    }

    .viewer-title {
        padding: 10px 13px;
    }

    .controls {
        bottom: 15px;
        max-width: calc(100% - 30px);
        overflow-x: auto;
    }

    .control-button {
        white-space: nowrap;
    }

    .fullscreen-button {
        right: 15px;
        bottom: 85px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        SKYLINE RESIDENCES
        <span>CONDOMINIUM PROJECT</span>
    </div>

    <!-- AR IS OUTSIDE THE 3D VIEWER -->
    <button class="ar-button" onclick="openAR()">
        View in AR
    </button>

</header>


<!-- =========================
     3D VIEW
========================= -->

<main class="viewer-wrapper">

    <canvas id="viewer"></canvas>

    <div class="viewer-top">

        <div class="viewer-title">
            <strong>3D SITE VIEW</strong>
            <small>Drag to rotate • Scroll to zoom</small>
        </div>

    </div>


    <!-- Viewer controls -->

    <div class="controls">

        <button class="control-button" onclick="resetCamera()">
            Reset
        </button>

        <button class="control-button" onclick="sitePlan()">
            Site Plan
        </button>

        <button class="control-button" onclick="toggleRotate()">
            Auto Rotate
        </button>

    </div>


    <!-- FULLSCREEN BUTTON -->

    <button
        class="fullscreen-button"
        onclick="toggleFullscreen()"
        title="Fullscreen">
        ⛶
    </button>

</main>


<!-- =========================
     AR PANEL
========================= -->

<div id="arPanel">

    <div class="ar-header">

        <strong>View in AR</strong>

        <button
            class="close-ar"
            onclick="closeAR()">
            Close
        </button>

    </div>

    <!--
        Replace this GLB with your actual AR model.

        Example:
        models/condo-ar.glb
    -->

    <model-viewer
        id="arViewer"
        src="models/sample-condo.glb"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral">

    </model-viewer>

</div>


<!-- Model Viewer for AR -->

<script type="module"
src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>


<script>

/* =====================================================
   THREE.JS SETUP
===================================================== */

const canvas = document.getElementById("viewer");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xdfe5e8);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / (window.innerHeight - 72),
    0.1,
    1000
);

camera.position.set(
    65,
    55,
    75
);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight - 72
);

renderer.shadowMap.enabled = true;


/* =====================================================
   LIGHTING
===================================================== */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    1.2
);

scene.add(ambientLight);


const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    40,
    80,
    40
);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
   GROUND
===================================================== */

const groundGeometry =
    new THREE.PlaneGeometry(
        220,
        220
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xbfc6c9
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   ROADS
===================================================== */

function createRoad(
    x,
    z,
    width,
    length
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            .12,
            length
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x555555
        });

    const road =
        new THREE.Mesh(
            geometry,
            material
        );

    road.position.set(
        x,
        .06,
        z
    );

    scene.add(road);
}


createRoad(
    0,
    0,
    20,
    190
);

createRoad(
    0,
    0,
    190,
    20
);


/* =====================================================
   BUILDINGS
===================================================== */

function createTower(
    x,
    z,
    height,
    color,
    label
) {

    const geometry =
        new THREE.BoxGeometry(
            18,
            height,
            18
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: color
        });

    const tower =
        new THREE.Mesh(
            geometry,
            material
        );

    tower.position.set(
        x,
        height / 2,
        z
    );

    tower.castShadow = true;
    tower.receiveShadow = true;

    scene.add(tower);


    /* Windows */

    for (
        let y = 5;
        y < height - 2;
        y += 4
    ) {

        for (
            let side = -1;
            side <= 1;
            side += 2
        ) {

            const windowGeometry =
                new THREE.BoxGeometry(
                    3,
                    2,
                    .2
                );

            const windowMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x87b7c9,
                    metalness: .2,
                    roughness: .2
                });

            const window =
                new THREE.Mesh(
                    windowGeometry,
                    windowMaterial
                );

            window.position.set(
                x + side * 9.05,
                y,
                z
            );

            scene.add(window);
        }
    }

    return tower;
}


createTower(
    -35,
    -30,
    50,
    0xe4e0d7,
    "Tower A"
);

createTower(
    35,
    -30,
    65,
    0xd5dce2,
    "Tower B"
);


/* =====================================================
   CLUBHOUSE
===================================================== */

const clubhouseGeometry =
    new THREE.BoxGeometry(
        30,
        8,
        18
    );

const clubhouseMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xd8c8b0
    });

const clubhouse =
    new THREE.Mesh(
        clubhouseGeometry,
        clubhouseMaterial
    );

clubhouse.position.set(
    0,
    4,
    45
);

clubhouse.castShadow = true;

scene.add(clubhouse);


/* =====================================================
   POOL
===================================================== */

const poolGeometry =
    new THREE.BoxGeometry(
        30,
        .5,
        15
    );

const poolMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4fa8c7,
        roughness: .15
    });

const pool =
    new THREE.Mesh(
        poolGeometry,
        poolMaterial
    );

pool.position.set(
    0,
    .3,
    25
);

scene.add(pool);


/* =====================================================
   TREES
===================================================== */

function createTree(x, z) {

    const trunkGeometry =
        new THREE.CylinderGeometry(
            .7,
            .9,
            5,
            8
        );

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x654321
        });

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.set(
        x,
        2.5,
        z
    );

    scene.add(trunk);


    const leavesGeometry =
        new THREE.SphereGeometry(
            4,
            12,
            12
        );

    const leavesMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x477a4b
        });

    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );

    leaves.position.set(
        x,
        7,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}


for (
    let i = 0;
    i < 30;
    i++
) {

    const x =
        (Math.random() - .5) * 160;

    const z =
        (Math.random() - .5) * 150;

    createTree(x, z);
}


/* =====================================================
   ORBIT CONTROLS
===================================================== */

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .08;

controls.minDistance = 25;

controls.maxDistance = 180;

controls.maxPolarAngle =
    Math.PI / 2.05;

controls.target.set(
    0,
    15,
    0
);


/* =====================================================
   CAMERA FUNCTIONS
===================================================== */

function resetCamera() {

    camera.position.set(
        65,
        55,
        75
    );

    controls.target.set(
        0,
        15,
        0
    );

    controls.update();
}


function sitePlan() {

    camera.position.set(
        0,
        150,
        0
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();
}


/* =====================================================
   AUTO ROTATE
===================================================== */

let rotating = false;

function toggleRotate() {

    rotating = !rotating;

    controls.autoRotate = rotating;

    controls.autoRotateSpeed = 1.5;
}


/* =====================================================
   FULLSCREEN
===================================================== */

function toggleFullscreen() {

    const viewer =
        document.querySelector(
            ".viewer-wrapper"
        );

    if (!document.fullscreenElement) {

        viewer.requestFullscreen();

    } else {

        document.exitFullscreen();

    }
}


/* =====================================================
   AR
===================================================== */

function openAR() {

    document.getElementById(
        "arPanel"
    ).style.display = "block";

}


function closeAR() {

    document.getElementById(
        "arPanel"
    ).style.display = "none";

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        const height =
            window.innerHeight -
            72;

        camera.aspect =
            window.innerWidth /
            height;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            height
        );

    }
);


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
