<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Condo 3D Walkthrough</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #viewer {
            position: fixed;
            inset: 0;
        }

        canvas {
            display: block;
        }

        /* TOP BAR */

        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            background: rgba(0,0,0,0.65);
            color: white;

            z-index: 10;

            backdrop-filter: blur(8px);
        }

        #title {
            font-size: 20px;
            font-weight: bold;
        }

        #subtitle {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 3px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            margin-left: 6px;

            background: white;
            color: #222;

            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ddd;
        }

        /* INSTRUCTIONS */

        #instructions {
            position: fixed;

            left: 20px;
            bottom: 20px;

            padding: 15px 18px;

            background: rgba(0,0,0,0.65);
            color: white;

            border-radius: 10px;

            z-index: 10;

            font-size: 13px;

            backdrop-filter: blur(8px);
        }

        /* LOCATION LABEL */

        #location {
            position: fixed;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            padding: 10px 18px;

            background: rgba(0,0,0,0.7);
            color: white;

            border-radius: 20px;

            z-index: 10;

            font-size: 14px;
        }

        /* MINIMAP */

        #map {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 180px;
            height: 180px;

            background: rgba(255,255,255,0.92);

            border-radius: 12px;

            z-index: 10;

            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        #mapTitle {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            padding: 8px;
        }

        #playerDot {
            position: absolute;

            width: 12px;
            height: 12px;

            background: red;

            border-radius: 50%;

            transform: translate(-50%, -50%);
        }

        .map-building {
            position: absolute;

            background: #777;

            border-radius: 3px;
        }

        .towerA {
            width: 35px;
            height: 55px;

            left: 25px;
            top: 55px;
        }

        .towerB {
            width: 35px;
            height: 55px;

            right: 25px;
            top: 55px;
        }

        .pool {
            position: absolute;

            width: 70px;
            height: 30px;

            left: 55px;
            bottom: 30px;

            background: #6fc4df;

            border-radius: 4px;
        }

        /* MOBILE */

        @media(max-width: 700px) {

            #instructions {
                font-size: 11px;
                bottom: 10px;
                left: 10px;
            }

            #map {
                width: 120px;
                height: 120px;
                right: 10px;
                bottom: 10px;
            }

            #topbar {
                padding: 0 12px;
            }

            #title {
                font-size: 15px;
            }

            button {
                padding: 8px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div id="viewer"></div>

<!-- TOP BAR -->

<div id="topbar">

    <div>
        <div id="title">
            SKYLINE RESIDENCES
        </div>

        <div id="subtitle">
            Interactive 3D Site Walkthrough
        </div>
    </div>

    <div>

        <button onclick="resetView()">
            Reset
        </button>

        <button onclick="toggleRotate()">
            Auto Rotate
        </button>

        <button onclick="sitePlan()">
            Site Plan
        </button>

    </div>

</div>

<!-- INSTRUCTIONS -->

<div id="instructions">

    <b>Walk around</b><br><br>

    🖱 Drag = Look around<br>
    🖱 Double-click = Move here<br>
    ⌨ WASD / Arrow Keys = Walk<br>
    🔄 Scroll = Zoom

</div>

<!-- LOCATION -->

<div id="location">
    Entrance
</div>

<!-- MINI MAP -->

<div id="map">

    <div id="mapTitle">
        SITE PLAN
    </div>

    <div class="map-building towerA"></div>
    <div class="map-building towerB"></div>

    <div class="pool"></div>

    <div id="playerDot"
         style="left:90px; top:125px;">
    </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>

    // =========================================================
    // BASIC THREE.JS SETUP
    // =========================================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x9fc4d6);


    const camera = new THREE.PerspectiveCamera(

        60,

        window.innerWidth / window.innerHeight,

        0.1,

        1000

    );


    camera.position.set(

        35,
        25,
        45

    );


    const renderer = new THREE.WebGLRenderer({

        antialias: true

    });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.setPixelRatio(

        Math.min(window.devicePixelRatio, 2)

    );


    renderer.shadowMap.enabled = true;


    document
        .getElementById("viewer")
        .appendChild(renderer.domElement);


    // =========================================================
    // CAMERA CONTROLS
    // =========================================================

    const controls = new THREE.OrbitControls(

        camera,
        renderer.domElement

    );


    controls.enableDamping = true;

    controls.dampingFactor = 0.08;

    controls.maxPolarAngle = Math.PI / 2.05;

    controls.minDistance = 5;

    controls.maxDistance = 120;


    // =========================================================
    // LIGHTING
    // =========================================================

    const sunlight = new THREE.DirectionalLight(

        0xffffff,

        2

    );


    sunlight.position.set(

        30,
        60,
        20

    );


    sunlight.castShadow = true;


    scene.add(sunlight);


    const ambient = new THREE.HemisphereLight(

        0xffffff,
        0x667788,
        1.5

    );


    scene.add(ambient);


    // =========================================================
    // MATERIALS
    // =========================================================

    const grassMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x557a48

        });


    const roadMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x333333

        });


    const buildingMaterial =
        new THREE.MeshStandardMaterial({

            color: 0xd8d8d8

        });


    const glassMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x6ca9c5,

            metalness: 0.2,

            roughness: 0.2

        });


    const roofMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x555555

        });


    const poolMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x37a9d6,

            metalness: 0.1,

            roughness: 0.1

        });


    // =========================================================
    // GROUND
    // =========================================================

    const ground = new THREE.Mesh(

        new THREE.BoxGeometry(

            120,
            1,
            100

        ),

        grassMaterial

    );


    ground.position.y = -0.5;

    ground.receiveShadow = true;

    scene.add(ground);


    // =========================================================
    // ROAD
    // =========================================================

    function createBox(

        width,
        height,
        depth,
        material,
        x,
        y,
        z

    ){

        const mesh = new THREE.Mesh(

            new THREE.BoxGeometry(

                width,
                height,
                depth

            ),

            material

        );


        mesh.position.set(

            x,
            y,
            z

        );


        mesh.castShadow = true;

        mesh.receiveShadow = true;


        scene.add(mesh);


        return mesh;

    }


    createBox(

        120,
        0.15,
        10,

        roadMaterial,

        0,
        0.05,
        0

    );


    createBox(

        10,
        0.15,
        100,

        roadMaterial,

        0,
        0.06,
        0

    );


    // =========================================================
    // CONDO TOWER
    // =========================================================

    function createTower(

        x,
        z,
        floors

    ){

        const towerHeight = floors * 3;


        const tower = createBox(

            14,
            towerHeight,
            14,

            buildingMaterial,

            x,
            towerHeight / 2,
            z

        );


        // windows

        for(

            let floor = 0;

            floor < floors;

            floor++

        ){

            const y =

                1.5 +

                floor * 3;


            for(

                let side = -1;

                side <= 1;

                side += 2

            ){

                createBox(

                    0.15,
                    1.5,
                    2.5,

                    glassMaterial,

                    x + side * 7.05,

                    y,
                    z

                );


                createBox(

                    2.5,
                    1.5,
                    0.15,

                    glassMaterial,

                    x,

                    y,
                    z + side * 7.05

                );

            }

        }


        // roof

        createBox(

            15,
            1,
            15,

            roofMaterial,

            x,
            towerHeight + 0.5,
            z

        );


        return tower;

    }


    createTower(

        -28,

        -25,

        8

    );


    createTower(

        28,

        -25,

        10

    );


    // =========================================================
    // CLUBHOUSE
    // =========================================================

    createBox(

        22,
        5,
        14,

        buildingMaterial,

        0,
        2.5,
        27

    );


    // clubhouse glass

    createBox(

        18,
        3,
        0.2,

        glassMaterial,

        0,
        2.5,
        20

    );


    // =========================================================
    // SWIMMING POOL
    // =========================================================

    createBox(

        25,
        0.3,
        12,

        poolMaterial,

        0,
        0.2,
        10

    );


    // pool border

    createBox(

        28,
        0.4,
        2,

        buildingMaterial,

        0,
        0.3,
        3.5

    );


    createBox(

        28,
        0.4,
        2,

        buildingMaterial,

        0,
        0.3,
        16.5

    );


    // =========================================================
    // TREES
    // =========================================================

    function createTree(

        x,
        z

    ){

        // trunk

        createBox(

            0.8,
            3,
            0.8,

            new THREE.MeshStandardMaterial({

                color: 0x654321

            }),

            x,
            1.5,
            z

        );


        const leaves = new THREE.Mesh(

            new THREE.SphereGeometry(

                3.5,
                16,
                16

            ),

            new THREE.MeshStandardMaterial({

                color: 0x286b36

            })

        );


        leaves.position.set(

            x,
            5,
            z

        );


        leaves.castShadow = true;


        scene.add(leaves);

    }


    const treePositions = [

        [-48, 20],

        [-42, 32],

        [-30, 40],

        [30, 40],

        [42, 32],

        [48, 20],

        [-48, -5],

        [48, -5],

        [-45, -35],

        [45, -35]

    ];


    treePositions.forEach(

        p => createTree(

            p[0],

            p[1]

        )

    );


    // =========================================================
    // PARKING
    // =========================================================

    for(

        let i = 0;

        i < 8;

        i++

    ){

        createBox(

            4,

            0.08,

            7,

            new THREE.MeshStandardMaterial({

                color: 0xdddddd

            }),

            -25 + (i % 4) * 6,

            0.12,

            8 + Math.floor(i / 4) * 9

        );

    }


    // =========================================================
    // WALKING / DOUBLE CLICK
    // =========================================================

    let targetPosition = null;


    renderer.domElement.addEventListener(

        "dblclick",

        function(event){

            const mouse = new THREE.Vector2();


            mouse.x =

                (event.clientX /

                window.innerWidth) * 2 - 1;


            mouse.y =

                -(event.clientY /

                window.innerHeight) * 2 + 1;


            const raycaster =

                new THREE.Raycaster();


            raycaster.setFromCamera(

                mouse,

                camera

            );


            const intersects =

                raycaster.intersectObject(

                    ground

                );


            if(

                intersects.length > 0

            ){

                const point =

                    intersects[0].point;


                targetPosition =

                    new THREE.Vector3(

                        point.x,

                        8,

                        point.z

                    );


                document
                    .getElementById("location")
                    .innerText =
                    "Walking to selected location...";

            }

        }

    );


    // =========================================================
    // KEYBOARD MOVEMENT
    // =========================================================

    const keys = {};


    window.addEventListener(

        "keydown",

        event => {

            keys[event.key.toLowerCase()] = true;

        }

    );


    window.addEventListener(

        "keyup",

        event => {

            keys[event.key.toLowerCase()] = false;

        }

    );


    function movePlayer(){

        const speed = 0.35;


        if(keys["w"] || keys["arrowup"]){

            camera.position.z -= speed;

        }


        if(keys["s"] || keys["arrowdown"]){

            camera.position.z += speed;

        }


        if(keys["a"] || keys["arrowleft"]){

            camera.position.x -= speed;

        }


        if(keys["d"] || keys["arrowright"]){

            camera.position.x += speed;

        }


        // keep player above ground

        if(camera.position.y < 2){

            camera.position.y = 2;

        }


        updateMap();

    }


    // =========================================================
    // DOUBLE CLICK MOVEMENT
    // =========================================================

    function moveToTarget(){

        if(!targetPosition){

            return;

        }


        camera.position.lerp(

            targetPosition,

            0.04

        );


        controls.target.lerp(

            new THREE.Vector3(

                targetPosition.x,

                3,

                targetPosition.z

            ),

            0.04

        );


        const distance =

            camera.position.distanceTo(

                targetPosition

            );


        if(distance < 0.5){

            targetPosition = null;

            document
                .getElementById("location")
                .innerText =
                "You are here";

        }


        updateMap();

    }


    // =========================================================
    // MINI MAP
    // =========================================================

    function updateMap(){

        const dot =

            document.getElementById(

                "playerDot"

            );


        const mapX =

            90 + camera.position.x * 1.25;


        const mapY =

            125 + camera.position.z * 1.25;


        dot.style.left =

            Math.max(

                5,

                Math.min(

                    175,

                    mapX

                )

            ) + "px";


        dot.style.top =

            Math.max(

                20,

                Math.min(

                    175,

                    mapY

                )

            ) + "px";

    }


    // =========================================================
    // RESET
    // =========================================================

    function resetView(){

        camera.position.set(

            35,

            25,

            45

        );


        controls.target.set(

            0,

            5,

            0

        );


        document
            .getElementById("location")
            .innerText =
            "Entrance";

    }


    // =========================================================
    // AUTO ROTATE
    // =========================================================

    let rotating = false;


    function toggleRotate(){

        rotating = !rotating;

        controls.autoRotate = rotating;

        controls.autoRotateSpeed = 1.5;

    }


    // =========================================================
    // SITE PLAN
    // =========================================================

    function sitePlan(){

        camera.position.set(

            0,

            90,

            0

        );


        controls.target.set(

            0,

            0,

            0

        );


        document
            .getElementById("location")
            .innerText =
            "Site Plan";

    }


    // =========================================================
    // WINDOW RESIZE
    // =========================================================

    window.addEventListener(

        "resize",

        function(){

            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }

    );


    // =========================================================
    // ANIMATION
    // =========================================================

    function animate(){

        requestAnimationFrame(

            animate

        );


        movePlayer();

        moveToTarget();

        controls.update();


        renderer.render(

            scene,

            camera

        );

    }


    animate();

</script>

</body>
</html>
