```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flats</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Model Viewer -->
    <script type="module"
        src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: #274535;
            overflow: hidden;
        }

        /* =========================
           INTRO SCREEN
        ========================= */

        .intro {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #274535;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        .intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .logo {
            width: 120px;
            max-width: 60vw;

            opacity: 0;

            transform: scale(0.97);

            animation: logoReveal 1.2s ease-out forwards;
        }

        .logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes logoReveal {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================
           MAIN SITE
        ========================= */

        .site {
            width: 100%;
            height: 100vh;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        .site.show {
            opacity: 1;
            visibility: visible;
        }


        /* =========================
           TOP SECTION
        ========================= */

        .top {
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            background: #274535;
            color: white;
        }

        .top h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }


        /* =========================
           MODEL AREA
        ========================= */

        .viewer-wrapper {
            position: relative;

            width: 100%;
            height: calc(100vh - 90px);

            background: #dedbd5;
        }

        model-viewer {
            width: 100%;
            height: 100%;

            background: #dedbd5;

            --poster-color: transparent;
            --progress-bar-color: white;
            --progress-mask: #dedbd5;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #dedbd5;

            z-index: 5;

            pointer-events: none;

            transition: opacity 0.5s ease;
        }

        .loading span {
            font-size: 13px;
            letter-spacing: 1px;
            color: #274535;
        }


        /* =========================
           FULLSCREEN BUTTON
        ========================= */

        .fullscreen-btn {
            position: absolute;

            top: 20px;
            right: 20px;

            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.9);
            color: #274535;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .fullscreen-btn:hover {
            transform: scale(1.05);
            background: white;
        }


        /* =========================
           AR BUTTON
        ========================= */

        #ar-button {
            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            border: none;
            border-radius: 30px;

            padding: 13px 24px;

            background: #274535;
            color: white;

            font-family: inherit;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        #ar-button:hover {
            transform: translateX(-50%) scale(1.03);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo {
                width: 105px;
            }

            .top {
                height: 75px;
                padding: 0 22px;
            }

            .top h2 {
                font-size: 19px;
            }

            .viewer-wrapper {
                height: calc(100vh - 75px);
            }

            .fullscreen-btn {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         INTRO
    ========================= -->

    <div class="intro" id="intro">
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
    </div>


    <!-- =========================
         MAIN SITE
    ========================= -->

    <main class="site" id="site">

        <header class="top">
            <h2>Flats</h2>
        </header>


        <section class="viewer-wrapper">

            <!-- Loading -->
            <div class="loading" id="loading">
                <span>Loading...</span>
            </div>

            <!-- 3D Model -->
            <model-viewer
                id="model"
                src="models/building.glb"
                alt="3D architectural model"
                camera-controls
                auto-rotate
                shadow-intensity="1"
                exposure="1"
                ar
                ar-modes="webxr scene-viewer quick-look">
            </model-viewer>


            <!-- Fullscreen -->
            <button
                class="fullscreen-btn"
                id="fullscreenBtn"
                aria-label="Fullscreen">
                ⛶
            </button>


            <!-- AR -->
            <button
                id="ar-button">
                View in AR
            </button>

        </section>

    </main>


    <script>

        const intro = document.getElementById("intro");
        const site = document.getElementById("site");
        const model = document.getElementById("model");
        const loading = document.getElementById("loading");
        const fullscreenBtn = document.getElementById("fullscreenBtn");


        /* =========================
           INTRO TIMING
        ========================= */

        window.addEventListener("load", () => {

            setTimeout(() => {
                intro.classList.add("hide");
                site.classList.add("show");
            }, 1800);

        });


        /* =========================
           MODEL LOADING
        ========================= */

        model.addEventListener("load", () => {

            loading.style.opacity = "0";

            setTimeout(() => {
                loading.style.display = "none";
            }, 500);

        });


        /* =========================
           FULLSCREEN
        ========================= */

        fullscreenBtn.addEventListener("click", () => {

            const viewerWrapper = document.querySelector(".viewer-wrapper");

            if (!document.fullscreenElement) {
                viewerWrapper.requestFullscreen();
            } else {
                document.exitFullscreen();
            }

        });

    </script>

</body>
</html>
```
