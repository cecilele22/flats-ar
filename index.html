<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flats AR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
</head>

<body>

    <!-- =========================
         LOGO INTRO
    ========================== -->

    <div id="intro-screen" class="intro-screen">

        <div class="intro-content">

            <div class="logo-mark">
                YOUR LOGO
            </div>

            <div class="logo-line"></div>

            <p class="intro-tagline">
                A new way of seeing home.
            </p>

        </div>

    </div>


    <!-- =========================
         MAIN EXPERIENCE
    ========================== -->

    <main id="main-site" class="main-site">

        <!-- 3D PREVIEW -->

        <section class="property-preview">

            <div class="preview-header">

                <div>
                    <p class="eyebrow">EXPLORE THE DEVELOPMENT</p>

                    <h1>
                        Your Property
                    </h1>
                </div>

            </div>


            <!-- 3D VIEWER -->

            <div id="viewer-container" class="viewer-container">

                <div id="loading-screen" class="loading-screen">
                    <div class="loading-spinner"></div>
                    <span>Loading experience...</span>
                </div>

                <canvas id="three-canvas"></canvas>


                <!-- FULLSCREEN BUTTON -->

                <button
                    id="fullscreen-btn"
                    class="fullscreen-btn"
                    aria-label="Fullscreen">

                    ⛶

                </button>

            </div>


            <!-- AR BUTTON -->

            <div class="ar-section">

                <p>
                    See the development in your surroundings.
                </p>

                <button id="ar-button" class="ar-button">

                    <span>VIEW IN AR</span>

                    <span class="arrow">↗</span>

                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         AR MODEL
    ========================== -->

    <model-viewer
        id="ar-model"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        ar
        ar-modes="scene-viewer webxr quick-look"
        camera-controls
        shadow-intensity="1"
        exposure="1"
        style="display:none;">

    </model-viewer>


    <script src="script.js"></script>

</body>
</html>
