    </main>


    <script>


        /* =========================
           ELEMENTS
        ========================= */

        const intro =
            document.getElementById("intro");


        const site =
            document.getElementById("site");


        const viewer =
            document.getElementById("modelViewer");


        const loading =
            document.getElementById("loading");


        const fullscreen =
            document.getElementById("fullscreen");


        const arButton =
            document.getElementById("arButton");


        /* =========================
           INTRO
        ========================= */

        window.addEventListener(
            "load",
            () => {

                setTimeout(() => {

                    intro.classList.add("hide");

                    site.classList.add("show");

                }, 2500);

            }
        );


        /* =========================
           MODEL LOADING
        ========================= */

        viewer.addEventListener(
            "load",
            () => {

                console.log(
                    "3D model loaded successfully."
                );


                loading.classList.add(
                    "hidden"
                );

            }
        );


        viewer.addEventListener(
            "error",
            (event) => {

                console.error(
                    "3D MODEL ERROR:",
                    event
                );


                loading.innerHTML = `

                    <div class="loading-inner">

                        <span>
                            Unable to load 3D model
                        </span>

                    </div>

                `;

            }
        );


        /* =========================
           FULLSCREEN
        ========================= */

        fullscreen.addEventListener(
            "click",
            async () => {

                const wrapper =
                    document.querySelector(
                        ".viewer-wrapper"
                    );


                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await wrapper.requestFullscreen();

                    } else {

                        await document.exitFullscreen();

                    }

                } catch (error) {

                    console.error(
                        "Fullscreen error:",
                        error
                    );

                }

            }
        );


        /* =========================
           AR
        ========================= */

        arButton.addEventListener(
            "click",
            async () => {

                console.log(
                    "AR button clicked."
                );


                try {

                    if (
                        !viewer.canActivateAR
                    ) {

                        alert(
                            "AR is not available on this device. Please open this page on a compatible iPhone or Android phone."
                        );

                        return;

                    }


                    await viewer.activateAR();

                } catch (error) {

                    console.error(
                        "AR ERROR:",
                        error
                    );


                    alert(
                        "AR could not be launched. Please try opening the website on a compatible mobile device."
                    );

                }

            }
        );


    </script>
